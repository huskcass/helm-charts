# Copies vendored charts from the latest stable GitHub Release of each upstream
# repo (hack/sync-upstream-charts.py) and opens a pull request.
#
# The pull request is the point. main publishes immediately: release.yml
# packages every chart whose version moved and pushes it to GitHub Pages.
# A sync that has not been looked at must not take that path, so this
# workflow never pushes to main. It does not use pull_request_target.
name: sync-upstream-charts

on:
  schedule:
    # 08:00 PT on weekdays in standard time (PST, UTC-8); GitHub cron is UTC,
    # so it runs at 09:00 PT during daylight time.
    - cron: '0 16 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# One sync at a time. Cancelling a run that is mid-push would leave the
# branch and its pull request disagreeing about what was copied.
concurrency:
  group: sync-upstream-charts
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: check-chart-version.sh merge-bases against origin/main,
          # and check-chart-images.sh reads the base Chart.yaml out of git.
          fetch-depth: 0
          # Keep the token. ci.yml turns this off because nothing there pushes;
          # this job pushes chore/sync-upstream-charts (never main) with it.
          persist-credentials: true

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      # crane resolves image digests. The sync refuses a chart whose Docker Hub
      # mirror is not published yet, and check-chart-images.sh does the same
      # for every image a bumped chart renders.
      - name: Install crane
        run: |
          curl -sSfL https://github.com/google/go-containerregistry/releases/download/v0.22.1/go-containerregistry_Linux_x86_64.tar.gz \
            | sudo tar -xz -C /usr/local/bin crane
          crane version

      # The sync script's only non-stdlib dependency.
      - name: Install PyYAML
        run: python3 -m pip install --quiet --disable-pip-version-check pyyaml

      # continue-on-error: a chart that needs a human (patch no longer matches,
      # kept dependencies diverged, lint failed) must not hide the charts that
      # did sync. The job is failed at the end if any chart needs attention.
      # A missing image is a warning inside the script, not a step failure.
      - name: Sync charts that are behind
        id: sync
        continue-on-error: true
        env:
          # GITHUB_TOKEN raises the API rate limit. Pushes and pull requests
          # made with it do not trigger other workflows; see the push step.
          GH_TOKEN: ${{ github.token }}
        run: python3 hack/sync-upstream-charts.py --pr-body "$RUNNER_TEMP/pr-body.md"

      # Commit locally, then gate, then push. check-chart-version.sh diffs
      # commits, so it has to follow the commit; check-chart-images.sh reads the
      # tree either way. Nothing is pushed unless both pass. The refspec below
      # is the chore branch, never main.
      #
      # Pushes and pull requests made with GITHUB_TOKEN do not trigger other
      # workflows (ci.yml, check-images.yml). That is why lint, inside the sync
      # script, and these two checks run here. To get the normal checks on the
      # pull request, close and reopen it, or push an empty commit to the
      # branch. A PAT or a GitHub App token would trigger them, and none is
      # configured.
      #
      # gh pr create with GITHUB_TOKEN also needs the repository (or org)
      # setting "Allow GitHub Actions to create and approve pull requests".
      # Without it the push succeeds and the pull request call fails.
      - name: Commit, gate, and open or update the pull request
        if: steps.sync.outputs.synced != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          names="${{ steps.sync.outputs.synced }}"

          # The schedule checks out main. Recreate the branch from that commit
          # on every run (the previous sync is not a parent), and keep the
          # working tree the script just wrote.
          git checkout -B chore/sync-upstream-charts
          git add -A -- charts
          if git diff --cached --quiet; then
            echo "no chart file changes; not opening a pull request"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync ${names} from upstream stable releases"

          git fetch --no-tags origin main
          hack/check-chart-images.sh origin/main
          hack/check-chart-version.sh origin/main

          branch="$(git rev-parse --abbrev-ref HEAD)"
          if [ "${branch}" != "chore/sync-upstream-charts" ]; then
            echo "::error::refusing to push from ${branch}; this workflow only pushes chore/sync-upstream-charts"
            exit 1
          fi

          # The branch is rebuilt from main every run, so the update is not a
          # fast-forward. --force-with-lease refuses the push if the remote
          # branch moved since the fetch below. Skip the push entirely when
          # the remote tree is already identical: a new commit with the same
          # files would only churn the pull request.
          git fetch origin chore/sync-upstream-charts || true
          if git rev-parse --verify --quiet refs/remotes/origin/chore/sync-upstream-charts >/dev/null; then
            if [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'refs/remotes/origin/chore/sync-upstream-charts^{tree}')" ]; then
              echo "origin/chore/sync-upstream-charts already has this tree; skipping push"
            else
              git push --force-with-lease origin HEAD:chore/sync-upstream-charts
            fi
          else
            git push origin HEAD:chore/sync-upstream-charts
          fi

          title="chore: sync ${names} from upstream stable releases"
          existing="$(gh pr list --head chore/sync-upstream-charts --state open --json number --jq '.[].number')"
          if [ -n "${existing}" ]; then
            for n in ${existing}; do
              gh pr edit "${n}" --title "${title}" --body-file "${RUNNER_TEMP}/pr-body.md"
            done
          else
            gh pr create --base main --head chore/sync-upstream-charts \
              --title "${title}" --body-file "${RUNNER_TEMP}/pr-body.md"
          fi

      # Runs even when the sync step failed, so a chart that needs attention
      # turns the job red after the pull request for the charts that did sync
      # has been opened. A clean run (nothing behind, or everything synced)
      # leaves this step skipped.
      - name: Fail if a chart needs attention
        if: always() && (steps.sync.outcome == 'failure' || steps.sync.outputs.attention != '')
        run: |
          echo "::error::a vendored chart needs attention; the sync log has the details"
          exit 1
